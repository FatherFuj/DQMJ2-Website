<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Quest Monster Joker 2 Monster and Synthesis Guide</title>
    <link rel="stylesheet" href="./frontend/src/components/styles.css">
</head>
<body>
    <main class="page-shell">
        <h1 class="page-title">Dragon Quest Monster Joker 2 Online Guide</h1>

        <nav class="nav-row" aria-label="Guide navigation">
            <a class="nav-button" href="./frontend/pages/monsters.html">Monsters</a>
            <a class="nav-button" href="./frontend/pages/synthesis.html">Synthesis</a>
            <a class="nav-button" href="./frontend/pages/skills.html">Skills</a>
            <a class="nav-button" href="./frontend/pages/quests.html">Quests</a>
            <a class="nav-button" href="./frontend/pages/tips.html">Tips</a>
        </nav>

        <section class="toolbar" aria-label="Search and filter guide content">
            <div class="search-wrap">
                <label for="search" class="sr-only" style="position:absolute;left:-9999px;">Search guide</label>
                <input id="search" type="text" placeholder="Search monsters, skills, or pages...">
            </div>

            <div class="filter-wrap">
                <label for="filter" class="sr-only" style="position:absolute;left:-9999px;">Filter results</label>
                <select id="filter">
                    <option value="all">All Categories</option>
                    <option value="monsters">Monsters</option>
                    <option value="synthesis">Synthesis</option>
                    <option value="skills">Skills</option>
                    <option value="quests">Quests</option>
                </select>
            </div>
        </section>

        <div class="results" id="results">
            <article class="guide-item" data-category="monsters" data-name="slime monster list">
                <h3>Monsters</h3>
                <p>Browse monster stats and locations.</p>
            </article>
            <article class="guide-item" data-category="synthesis" data-name="synthesis recipes combinations">
                <h3>Synthesis</h3>
                <p>Plan fusion recipes and upgrades.</p>
            </article>
            <article class="guide-item" data-category="skills" data-name="skill guide builds">
                <h3>Skills</h3>
                <p>Review abilities and team-building tips.</p>
            </article>
            <article class="guide-item" data-category="quests" data-name="quest walkthroughs">
                <h3>Quests</h3>
                <p>Track story and optional objectives.</p>
            </article>
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('search');
        const filterSelect = document.getElementById('filter');
        const guideItems = Array.from(document.querySelectorAll('.guide-item'));

        function updateResults() {
            const query = searchInput.value.toLowerCase().trim();
            const category = filterSelect.value;

            guideItems.forEach((item) => {
                const matchesQuery = item.dataset.name.toLowerCase().includes(query);
                const matchesCategory = category === 'all' || item.dataset.category === category;
                item.style.display = matchesQuery && matchesCategory ? 'block' : 'none';
            });
        }

        searchInput.addEventListener('input', updateResults);
        filterSelect.addEventListener('change', updateResults);
    </script>
</body>
</html>
