

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/assets/styles.css">
    <title>Dragon Quest Monster Bestiary</title>
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <h1 class="page-title">Dragon Quest Monster Bestiary</h1>
            <p class="page-subtitle">Browse creatures, sort by name or rank, and filter by family and size.</p>
        </header>

        <nav class="nav-row" aria-label="Guide navigation">
            <a class="nav-button" href="../../index.html">Back to Home</a>
            
        </nav>

        <section class="toolbar bestiary-toolbar" aria-label="Monster filters and search">
            <div class="search-wrap">
                <label class="sr-only" for="searchName">Search monsters</label>
                <input id="searchName" type="search" placeholder="Search by monster name..." autocomplete="off">
            </div>

            <div class="filter-wrap">
                <label class="sr-only" for="sortBy">Sort monsters</label>
                <select id="sortBy" aria-label="Sort monsters">
                    <option value="name">Name</option>
                    <option value="rank">Rank</option>
                </select>
            </div>

            <div class="filter-wrap">
                <label class="sr-only" for="familyFilter">Filter by family</label>
                <select id="familyFilter" aria-label="Filter by family">
                    <option value="all">All families</option>
                    <option value="Slime">Slime</option>
                    <option value="Beast">Beast</option>
                    <option value="Dragon">Dragon</option>
                    <option value="Material">Material</option>
                    <option value="Demon">Demon</option>
                    <option value="Undead">Undead</option>
                    <option value="Incarni">Incarni</option>
                </select>
            </div>

            <div class="filter-wrap">
                <label class="sr-only" for="sizeFilter">Filter by size</label>
                <select id="sizeFilter" aria-label="Filter by size">
                    <option value="all">All sizes</option>
                    <option value="Small">Small</option>
                    <option value="Medium">Medium</option>
                    <option value="Large">Large</option>
                </select>
            </div>
        </section>

        <section class="bestiary-info">
            <p>Type a monster name to narrow the list, then refine by family or size.</p>
        </section>

        <div class="results" id="monsterList" aria-live="polite"></div>
    </div>
    <script type="module">
        import { supabase, publicStorageUrl } from '../src/lib/supabase.js'
        import { isFavorite, toggleFavorite } from '../src/lib/favorites.js'
        const rankOrder = ['F', 'E', 'D', 'C', 'B', 'A', 'S', 'X']

        const searchInput = document.getElementById('searchName')
        const sortInput = document.getElementById('sortBy')
        const familyInput = document.getElementById('familyFilter')
        const sizeInput = document.getElementById('sizeFilter')
        const monsterList = document.getElementById('monsterList')
        let monsters = []

        function normalizeSize(value) {
            const normalized = String(value ?? '').toUpperCase()
            const sizeMap = {
                SMALL: 'S',
                MEDIUM: 'M',
                LARGE: 'L',
                S: 'S',
                M: 'M',
                L: 'L'
            }

            return sizeMap[normalized] ?? normalized
        }

        function compareMonsters(a, b) {
            const sortMode = sortInput.value

            // Normalize fields safely
            const nameA = (a.name_en ?? "").toLowerCase()
            const nameB = (b.name_en ?? "").toLowerCase()
            const rankA = rankOrder.indexOf(a.rank)
            const rankB = rankOrder.indexOf(b.rank)

            if (sortMode === 'rank') {
                const rankDiff = rankA - rankB

                // If ranks are equal, sort alphabetically by name_en
                return rankDiff || nameA.localeCompare(nameB)
            }

            // Default alphabetical sort by name_en
            return nameA.localeCompare(nameB)
        }


        function renderMonsters() {
            const searchTerm = searchInput.value.trim().toLowerCase()
            const familyFilter = familyInput.value
            const sizeFilter = sizeInput.value

            const visibleMonsters = monsters
                .filter(monster => {
                    const name = (monster.name_en ?? "").toLowerCase()
                    const family = (monster.family ?? "").toLowerCase()
                    const size = normalizeSize(monster.size).toLowerCase()

                    const matchesSearch = name.includes(searchTerm)
                    const matchesFamily = familyFilter === 'all' || family === familyFilter.toLowerCase()
                    const matchesSize = sizeFilter === 'all' || size === normalizeSize(sizeFilter).toLowerCase()

                    return matchesSearch && matchesFamily && matchesSize
                })
                .sort(compareMonsters)

            monsterList.innerHTML = visibleMonsters.length
                ? visibleMonsters.map(monster => {
                    const monsterId = monster.monster_id
                    const favoriteState = isFavorite(monsterId)
                    const imagePath = `${publicStorageUrl}/monster-${String(monsterId).padStart(3, '0')}.png`

                    return `
                        <article class="monster-card">
                            <div class="monster-card-header">
                                <div>
                                    <h3>${monster.name_en}</h3>
                                    <p class="monster-rank">Rank ${monster.rank}</p>
                                </div>
                                <button
                                    class="favorite-button ${favoriteState ? 'is-favorite' : ''}"
                                    type="button"
                                    data-monster-id="${monsterId}"
                                    aria-label="${favoriteState ? 'Remove from favorites' : 'Add to favorites'}"
                                >♥</button>
                            </div>

                            <a class="monster-card-main" href="./monster-detail.html?id=${monsterId}">
                                <div class="monster-thumb-wrap">
                                    <img
                                        class="monster-thumb"
                                        src="${imagePath}"
                                        alt="${monster.name_en} thumbnail"
                                        loading="lazy"
                                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                    >
                                    <div class="monster-thumb-placeholder" style="display:none;">No image</div>
                                </div>
                                <p class="monster-description">${monster.description ?? ''}</p>
                                <div class="monster-meta">
                                    <span class="tag">${monster.family}</span>
                                    <span class="tag">${monster.size}</span>
                                </div>
                            </a>
                        </article>
                    `
                }).join('')
                : '<div class="empty-state"><p>No monsters match those filters.</p></div>'

            monsterList.querySelectorAll('.favorite-button').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.preventDefault()
                    event.stopPropagation()

                    const monsterId = Number(button.dataset.monsterId)
                    const nextState = toggleFavorite(monsterId)
                    button.classList.toggle('is-favorite', nextState)
                    button.setAttribute('aria-label', nextState ? 'Remove from favorites' : 'Add to favorites')
                    button.textContent = '♥'
                })
            })
        }


        searchInput.addEventListener('input', renderMonsters)
        sortInput.addEventListener('change', renderMonsters)
        familyInput.addEventListener('change', renderMonsters)
        sizeInput.addEventListener('change', renderMonsters)

        async function loadMonsters() {
            const { data, error } = await supabase
                .from('dqmj2_monsters')
                .select('*')

            if (error) {
                console.error('Error loading monsters:', error)
                return
            }

            monsters = data
            renderMonsters()
        }

        loadMonsters()
    </script>
</body>
</html>
