        const searchInput = document.getElementById('skillSearch')
        const skillList = document.getElementById('skillList')
        const resultCount = document.getElementById('skillResultCount')

        function getTableName(table, skill) {
            let sibling = table.previousElementSibling

            while (sibling) {
                if (/^H[2-5]$/.test(sibling.tagName)) {
                    const heading = sibling.textContent.replace('[edit]', '').trim()
                    return heading.startsWith('Dragon Quest Monsters: Joker') ? skill : heading
                }

                sibling = sibling.previousElementSibling
            }

            return skill
        }

        function isUnlockTable(table) {
            const headers = [...table.querySelectorAll('th')]
                .map(header => header.textContent.trim().toLowerCase())
                .join(' ')

            return headers.includes('ability') && headers.includes('skill points')
        }

        function parseUnlocks(table) {
            return [...table.querySelectorAll('tr')]
                .map(row => [...row.querySelectorAll('td')].map(cell => cell.textContent.trim()))
                .filter(cells => cells.length >= 2 && cells[0] && cells[1])
                .map(([ability, points]) => ({ ability, points }))
        }

        function applyJoker2Overrides(groups, skill) {
            for (const change of joker2UnlockOverrides[skill] ?? []) {
                const preferredGroups = change.group
                    ? groups.filter(group => group.name === change.group)
                    : groups
                const targetGroups = preferredGroups.length ? preferredGroups : groups
                let updated = false

                if (change.from) {
                    for (const group of targetGroups) {
                        const index = group.unlocks.findIndex(unlock =>
                            unlock.ability === change.from && (!change.fromPoints || unlock.points === change.fromPoints)
                        )

                        if (index < 0) {
                            continue
                        }

                        if (change.remove) {
                            group.unlocks.splice(index, 1)
                        } else {
                            group.unlocks[index].ability = change.to ?? change.from
                            group.unlocks[index].points = change.points ?? group.unlocks[index].points
                        }

                        updated = true
                        break
                    }
                }

                if (!updated && change.ability) {
                    const group = targetGroups[0]
                    if (group) {
                        group.unlocks.push({ ability: change.ability, points: change.points })
                    }
                }
            }
        }

        function getEditionSection(document) {
            const headings = [...document.querySelectorAll('h2, h3, h4, h5')]
            const heading = headings.find(item => item.textContent.includes('Dragon Quest Monsters: Joker 2'))

            if (!heading) {
                return { heading: null, nodes: [] }
            }

            const level = Number(heading.tagName.slice(1))
            const nodes = []
            let sibling = heading.nextElementSibling

            while (sibling && !(/^H[2-5]$/.test(sibling.tagName) && Number(sibling.tagName.slice(1)) <= level)) {
                nodes.push(sibling)
                sibling = sibling.nextElementSibling
            }

            return { heading, nodes }
        }

        function collectUnlockGroups(document, editionSection, skill) {
            const allTables = [...document.querySelectorAll('table')].filter(isUnlockTable)
            const editionTables = editionSection.nodes.flatMap(node => [
                ...(node.matches?.('table') ? [node] : []),
                ...(node.querySelectorAll?.('table') ?? [])
            ]).filter(isUnlockTable)
            const baseTables = editionSection.heading
                ? allTables.filter(table => table.compareDocumentPosition(editionSection.heading) & Node.DOCUMENT_POSITION_FOLLOWING)
                : allTables
            const groups = new Map()

            for (const table of baseTables) {
                const name = getTableName(table, skill)
                groups.set(name, { name, unlocks: parseUnlocks(table) })
            }

            for (const table of editionTables) {
                const beforeTable = table.previousElementSibling?.textContent ?? ''
                const name = [...groups.keys()]
                    .sort((left, right) => right.length - left.length)
                    .find(groupName => beforeTable.includes(groupName))
                    ?? (groups.size === 1 ? groups.keys().next().value : `${skill} · Joker 2`)

                groups.set(name, { name, unlocks: parseUnlocks(table) })
            }

            const unlockGroups = [...groups.values()].filter(group => group.unlocks.length)
            applyJoker2Overrides(unlockGroups, skill)
            return unlockGroups
        }

        function renderUnlocks(panel, groups, notes, sourceUrl) {
            panel.replaceChildren()

            if (groups.length) {
                for (const group of groups) {
                    const section = document.createElement('section')
                    const heading = document.createElement('h4')
                    const list = document.createElement('ul')

                    section.className = 'skill-unlock-group'
                    heading.className = 'skill-unlock-heading'
                    heading.textContent = group.name
                    list.className = 'skill-unlock-list'

                    for (const unlock of group.unlocks) {
                        const item = document.createElement('li')
                        const ability = document.createElement('span')
                        const points = document.createElement('span')

                        ability.textContent = unlock.ability
                        points.className = 'skill-unlock-points'
                        points.textContent = `${unlock.points} pts`
                        item.append(ability, points)
                        list.append(item)
                    }

                    section.append(heading, list)
                    panel.append(section)
                }
            } else {
                const emptyState = document.createElement('p')
                emptyState.className = 'skill-detail-message'
                emptyState.textContent = 'No unlock table is available for this entry.'
                panel.append(emptyState)
            }

            if (notes) {
                const note = document.createElement('p')
                note.className = 'skillset-note'
                note.textContent = notes
                panel.append(note)
            }

            const source = document.createElement('a')
            source.className = 'skill-source-link'
            source.href = sourceUrl
            source.target = '_blank'
            source.rel = 'noreferrer'
            source.textContent = 'Dragon Quest Wiki source'
            panel.append(source)
        }

        async function loadSkillDetails(skill, details, panel) {
            const pageTitle = wikiTitleOverrides[skill] ?? skill
            const sourceUrl = `https://dragon-quest.org/wiki/${encodeURIComponent(pageTitle.replaceAll(' ', '_'))}`
            const query = new URLSearchParams({
                action: 'parse',
                page: pageTitle,
                prop: 'text',
                format: 'json',
                origin: '*'
            })

            panel.textContent = 'Loading abilities...'

            try {
                const response = await fetch(`https://dragon-quest.org/w/api.php?${query}`)
                if (!response.ok) {
                    throw new Error(`Skill data request failed (${response.status}).`)
                }

                const data = await response.json()
                if (data.error || !data.parse?.text?.['*']) {
                    throw new Error(data.error?.info ?? 'Skill data is unavailable.')
                }

                const document = new DOMParser().parseFromString(data.parse.text['*'], 'text/html')
                const editionSection = getEditionSection(document)
                const editionNotes = editionSection.nodes
                    .filter(node => node.tagName === 'P')
                    .map(node => node.textContent.trim())
                    .filter(Boolean)
                    .join(' ')

                renderUnlocks(panel, collectUnlockGroups(document, editionSection, skill), editionNotes, sourceUrl)
                details.dataset.loaded = 'true'
            } catch (error) {
                panel.textContent = `${error.message} Close and reopen this skillset to retry.`
                panel.classList.add('skill-detail-message')
            }
        }

        function renderSkills() {
            const searchTerm = searchInput.value.trim().toLowerCase()
            const matches = skills.filter(skill => skill.toLowerCase().includes(searchTerm))
            const fragment = document.createDocumentFragment()

            matches.forEach((skill, index) => {
                const item = document.createElement('li')
                const details = document.createElement('details')
                const summary = document.createElement('summary')
                const number = document.createElement('span')
                const name = document.createElement('span')
                const panel = document.createElement('div')

                item.className = 'skill-entry'
                details.className = 'skill-disclosure'
                summary.className = 'skill-summary'
                number.className = 'skill-entry-number'
                number.textContent = String(index + 1).padStart(3, '0')
                name.className = 'skill-entry-name'
                name.textContent = skill
                panel.className = 'skill-detail-panel'
                summary.append(number, name)
                details.append(summary, panel)
                details.addEventListener('toggle', () => {
                    if (details.open && details.dataset.loaded !== 'true' && details.dataset.loading !== 'true') {
                        details.dataset.loading = 'true'
                        loadSkillDetails(skill, details, panel).finally(() => {
                            delete details.dataset.loading
                        })
                    }
                })
                item.append(details)
                fragment.append(item)
            })

            skillList.replaceChildren(fragment)
            resultCount.textContent = matches.length
                ? `Showing ${matches.length} of ${skills.length} skillsets`
                : 'No skillsets match that name.'
        }

        searchInput.addEventListener('input', renderSkills)
        renderSkills()
